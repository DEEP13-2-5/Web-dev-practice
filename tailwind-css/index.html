<!DOCTYPE html>

    <title>Activity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mt-20 mx-52 flex flex-wrap rounded border-2 border-black">
        <div class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white h-20 flex justify-center items-center font-bold rounded-t">News that you can trust</div>
        <div class="text-center mx-6 w-full">
            <h3 class="tex-lg font-semibold">Stay up to date with latest!</h3>

                subscribe to our newsletter for latest news straigth into your inbox. 
            </p>
            <form class="flex flex-wrap">
                <input placeholder="your@email.com" class="w-full mx-52 bg-slate-200 text-center placeholder:text-sm my-4 py-2 rounded">
                <button class="bg-purple-500 w-full text-white mx-52 py-2 rounded-full">Subscibe now</button>
                <p class="my-6 mt-6 w-full text-sm">We value for your privacy</p>
